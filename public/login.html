<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Entrar · Draven Sports</title>
<link rel="icon" href="/logo.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Oswald:wght@600;700&display=swap">
<style>
:root{--bg:#F6F5F1;--surface:#fff;--line:#E5E3DD;--fg:#18181B;--muted:#71717A;--accent:#D4AF37;--accent-2:#CA8A04;--red:#DC2626;--soft:#FBF3D9}
*{box-sizing:border-box}html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--fg);font:14px/1.5 Inter,system-ui,-apple-system,"Segoe UI",sans-serif;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);min-height:100vh}
.lado{background:radial-gradient(ellipse at 20% 0%,#27272A 0%,#09090B 55%,#000 100%);color:#fff;padding:48px;display:flex;flex-direction:column;justify-content:center;gap:20px;position:relative;overflow:hidden}
.lado::after{content:"";position:absolute;right:-90px;top:-90px;width:320px;height:320px;border-radius:50%;background:radial-gradient(circle,rgba(212,175,55,.25),transparent 70%)}
.selo{display:inline-flex;width:max-content;gap:8px;padding:5px 12px;border-radius:999px;border:1px solid rgba(212,175,55,.4);background:rgba(212,175,55,.1);color:var(--accent);font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase}
h1{font:700 52px/1 Oswald,"Arial Narrow",sans-serif;text-transform:uppercase;margin:0;text-wrap:balance}
h1 span{color:var(--accent)}
.lado p{color:#D4D4D8;max-width:440px;margin:0;font-size:15px}
.form{display:flex;align-items:center;justify-content:center;padding:32px max(16px,env(safe-area-inset-right,0px)) 32px max(16px,env(safe-area-inset-left,0px))}
.card{width:100%;max-width:400px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:28px;display:flex;flex-direction:column;gap:14px;box-shadow:0 10px 30px rgba(0,0,0,.06)}
.card img{width:92px;height:auto;align-self:center}
h2{font:600 22px/1.2 Oswald,"Arial Narrow",sans-serif;text-transform:uppercase;letter-spacing:.02em;margin:0;text-align:center}
.sub{color:var(--muted);text-align:center;margin:0;font-size:13px}
label{display:flex;flex-direction:column;gap:5px;font-size:12px;font-weight:600;color:var(--muted)}
input{font:inherit;color:var(--fg);border:1px solid var(--line);border-radius:12px;padding:11px 12px;background:#FAFAF8}
input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--soft)}
button{font:inherit;cursor:pointer;border:0;border-radius:12px;padding:12px;background:linear-gradient(90deg,var(--accent),var(--accent-2));color:#000;font-weight:800;text-transform:uppercase;letter-spacing:.06em;font-size:13px}
button:disabled{opacity:.6;cursor:wait}
button:focus-visible,.troca:focus-visible{outline:2px solid var(--fg);outline-offset:2px}
.troca{background:none;color:var(--fg);text-transform:none;letter-spacing:0;font-weight:600;padding:4px;font-size:13px;text-decoration:underline}
.err{color:var(--red);font-size:13px;margin:0;text-align:center}
[hidden]{display:none!important}
@media (max-width:820px){body{grid-template-columns:1fr}.lado{padding:28px 20px;gap:12px}h1{font-size:34px}.lado p{font-size:14px}}
</style>
</head>
<body>
<section class="lado">
  <span class="selo">Sistema interno · Draven Sports</span>
  <h1>Do ringue <span>ao campo</span>, do lead ao pedido</h1>
  <p>CRM, WhatsApp da equipe, vendas, produção e estoque da Draven no mesmo lugar.</p>
</section>
<section class="form">
  <form class="card" id="f" novalidate>
    <img src="/logo.jpg" alt="Draven Sports" width="92" height="93">
    <h2 id="t">Entrar</h2>
    <p class="sub" id="s">Use o e-mail e a senha da sua conta.</p>
    <label id="ln" hidden>Seu nome<input id="nome" name="nome" autocomplete="name"></label>
    <label>E-mail<input id="email" name="email" type="email" autocomplete="email" required></label>
    <label>Senha<input id="senha" name="senha" type="password" autocomplete="current-password" required minlength="8"></label>
    <p class="err" id="e" hidden></p>
    <button type="submit" id="b">Entrar</button>
    <button type="button" class="troca" id="x">Criar minha conta</button>
  </form>
</section>
<script>
const $=s=>document.querySelector(s);let modo='login',pode=true;
function ver(m){modo=m;const c=m!=='login';$('#ln').hidden=!c;$('#t').textContent=m==='primeiro'?'Criar conta da gestão':c?'Criar conta':'Entrar';
  $('#s').textContent=m==='primeiro'?'Primeiro acesso: esta conta será a administradora do sistema.':c?'Depois de criar, a gestão libera o seu perfil.':'Use o e-mail e a senha da sua conta.';
  $('#b').textContent=c?'Criar conta':'Entrar';$('#senha').autocomplete=c?'new-password':'current-password';$('#x').hidden=m==='primeiro'||(!pode&&m==='login');$('#x').textContent=c?'Já tenho conta':'Criar minha conta';$('#e').hidden=true}
fetch('/api/auth/state').then(r=>r.json()).then(s=>{pode=s.signup;ver(s.hasUsers?'login':'primeiro');if(s.reservado)$('#s').textContent='Primeiro acesso: use o e-mail da gestão definido no servidor (OWNER_EMAIL). Esta conta será a administradora do sistema.'}).catch(()=>{});
$('#x').onclick=()=>ver(modo==='login'?'cadastro':'login');
$('#f').onsubmit=async e=>{e.preventDefault();const b=$('#b');b.disabled=true;$('#e').hidden=true;
  const body=modo==='login'?{email:$('#email').value,password:$('#senha').value}:{name:$('#nome').value,email:$('#email').value,password:$('#senha').value};
  try{const r=await fetch(modo==='login'?'/api/auth/login':'/api/auth/signup',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(body)});const j=await r.json().catch(()=>({}));
    if(!r.ok)throw new Error(j.message||'Não foi possível entrar.');location.href='/'}
  catch(err){$('#e').textContent=err.message;$('#e').hidden=false;b.disabled=false}};
</script>
</body>
</html>
